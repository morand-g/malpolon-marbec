hydra:
  run:
    dir: ${data.root}outputs/${run.run_name}outputs/${run.run_name}
run:
  predict: false
  exp_name: 0_test
  run_name: ${run.exp_name}-${now:%Y-%m-%d_%H-%M}
  checkpoint_path: null #${data.root}outputs/${run.run_name}outputs/11_satenv_pa-2025-02-05_17-45/last.ckpt
data:
  root: /marbec-data/RLS-Australia/malpolon/
  inputs_path: ${data.root}inputs
  dataset_name: database_split_binned-25.csv
  num_classes: 1796
  train_batch_size: 64
  inference_batch_size: 16
  num_workers: 8
trainer:
  accelerator: "auto"
  devices: "auto"
  max_epochs: 40
  val_check_interval: 100
  check_val_every_n_epoch: 1
  detect_anomaly: false
model:
  num_species: ${data.num_classes}
  num_bins: 2
  freeze_submodels: true
  submodels:
    env:
      provider_name: torchvision
      model_name: resnet18
      checkpoint: null #${data.root}outputs/${run.run_name}outputs/9_env_pa-2025-02-05_11-07/last.ckpt
      model_kwargs:
        weights: null
      modifiers:
        change_last_layer:
          num_outputs: ${eval:'${model.num_species} * ${model.num_bins}'}
        change_first_convolutional_layer:
          num_input_channels: 17
optim:
  optimizer:
    adamw:
      kwargs:
        lr: 0.1
        weight_decay: 0.5
      scheduler: 
        reduce_lr_on_plateau:
          kwargs:
            patience: 6
            eps: 1e-9
            factor: 0.2
          lr_scheduler_config:
            monitor: loss/val
  loss: modified_ce_loss
loggers:
  log_dir_name: ${data.root}outputs/${run.run_name}logs/
