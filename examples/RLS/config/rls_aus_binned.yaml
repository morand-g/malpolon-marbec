hydra:
  run:
    dir: ${data.root}local/outputs/${run.run_name}
run:
  predict: false
  interpretable: false
  exp_name: 0_mm4_transductif_bins
  run_name: ${run.exp_name}-${now:%Y-%m-%d_%H-%M}
  checkpoint_path: null #${data.root}outputs/37_mm4_transductif-2025-12-08_16-06/last.ckpt
  finetuning_mode: transductive # null or transductive or species
data:
  root: /marbec-data/RLS-Australia/malpolon/
  inputs_path: ${data.root}inputs/australia/
  dataset_name: database_common_binned100.csv
  num_classes: 817
  train_batch_size: 16
  inference_batch_size: 64
  num_workers: 2
trainer:
  accelerator: auto
  devices: auto
  max_epochs: 30
  val_check_interval: 100
  check_val_every_n_epoch: 1
  log_every_n_steps: 100
  detect_anomaly: false
model:
  num_species: ${data.num_classes}
  num_bins: 100
  aggregator: MLP
  freeze_submodels: true
  submodels:
    env:
      provider_name: torchvision
      model_name: resnet18
      checkpoint: ${data.root}outputs/36_fm_transductif-2025-12-02_08-53/last.ckpt
      model_kwargs:
        weights: IMAGENET1K_V1
      modifiers:
        change_last_layer:
          num_outputs: ${eval:'${model.num_bins}*${model.num_species}'}
        change_first_convolutional_layer:
          num_input_channels: 15
    # humhd:
