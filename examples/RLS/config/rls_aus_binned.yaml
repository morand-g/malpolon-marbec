hydra:
  run:
    dir: ${data.root}outputs/${run.run_name}
run:
  predict: false
  interpretable: false
  exp_name: 33_mm4_transductif
  run_name: ${run.exp_name}-${now:%Y-%m-%d_%H-%M}
  checkpoint_path: ${data.root}outputs/33_mm4_transductif-2025-11-18_16-30/last.ckpt
data:
  root: /marbec-data/RLS-Australia/malpolon/
  inputs_path: ${data.root}inputs/australia/
  dataset_name: database_split.csv
  num_classes: 1796
  train_batch_size: 16
  inference_batch_size: 64
  num_workers: 8
trainer:
  accelerator: "auto"
  devices: "auto"
  max_epochs: 80
  val_check_interval: 100
  check_val_every_n_epoch: 1
  log_every_n_steps: 100
  detect_anomaly: false
model:
  num_species: ${data.num_classes}
  num_bins: 2
  freeze_submodels: true
  submodels:
    env:
      provider_name: torchvision
      model_name: resnet18
      model_kwargs:
        weights: IMAGENET1K_V1
      modifiers:
        change_last_layer:
          num_outputs: ${eval:'${model.num_bins}*${model.num_species}'}
        change_first_convolutional_layer:
          num_input_channels: 15
    humhd:
      provider_name: torchvision
      model_name: resnet18
      model_kwargs:
        weights: IMAGENET1K_V1
      modifiers:
        change_last_layer:
          num_outputs: ${eval:'${model.num_bins}*${model.num_species}'}
        change_first_convolutional_layer:
          num_input_channels: 4
    bathy:
      provider_name: torchvision
      model_name: resnet18
      model_kwargs:
        weights: IMAGENET1K_V1
      modifiers:
        change_last_layer:
          num_outputs: ${eval:'${model.num_bins}*${model.num_species}'}
        change_first_convolutional_layer:
          num_input_channels: 1
    dhw:
      provider_name: torchvision
      model_name: resnet18
      model_kwargs:
        weights: IMAGENET1K_V1
      modifiers:
        change_last_layer:
          num_outputs: ${eval:'${model.num_bins}*${model.num_species}'}
        change_first_convolutional_layer:
          num_input_channels: 1
optim:
  optimizer:
    adamw:
      kwargs:
        lr: 1e-3
        weight_decay: 0.5
      scheduler: 
        reduce_lr_on_plateau:
          kwargs:
            patience: 6
            eps: 1e-9
            factor: 0.2
          lr_scheduler_config:
            monitor: loss/val
  loss: modified_ce_loss
loggers:
  log_dir_name: ${data.root}logs/

