    #       num_outputs: ${eval:'${model.num_bins}*${model.num_species}'}
    #     change_first_convolutional_layer:
    #       num_input_channels: 1
optim:
  optimizer:
    adamw:
      kwargs:
        lr: 1e-4
        weight_decay: 1e-4
      scheduler: 
        reduce_lr_on_plateau:
          kwargs:
            patience: 6
            eps: 1e-9
            factor: 0.2
          lr_scheduler_config:
            monitor: loss/val
  loss: mse_loss
loggers:
  log_dir_name: ${data.root}local/logs/

