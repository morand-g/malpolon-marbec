hydra:
#  output_subdir: null
  run:
    dir: outputs/${hydra.job.name}/${now:%Y-%m-%d}

run:
  fold: 0
  mode: train
  checkpoint_path:

hpo:
  n_trials: 20


data:
  backend: dali
  dataset_path: ../../../images/seasonal
  tiff_root: ../../../images/seasonal
  wds_root: ../../../images/seasonal
  split_path: ???
  labels_name: /../common_seasonal_composite.csv
  train_batch_size: 64
  inference_batch_size: 64
  num_workers: 9
  val_split: 0.2
  test_split: 0.2
  nature: seasonal
  nightlight:
  dict_normalize: mean_std_normalize_HS.json
  fold_path: folds_mada.pkl

task:
  task: regression

trainer:
  accelerator: gpu
  devices: 1
  max_epochs: 100
  check_val_every_n_epoch: 1

model:
  provider_name: torchvision
  model_name: resnet18
  model_kwargs:
    weights: null
    num_classes: null
    in_chans: null
    output_stride: null
    global_pool: null
  modifiers:
    change_first_convolutional_layer:
      num_input_channels: 24
    change_last_layer:
      num_outputs: 1

optim:
  optimizer:
    adamw: # ['adam', 'sgd', 'adamw', 'adadelta', 'adagrad', 'adamax', 'rmsprop']
      # callable: 'optim.SGD'
      kwargs:
        lr: 1e-4
        weight_decay: 1.0e-05
      scheduler: # Optional, delete key or leave empty to not use any learning rate scheduler
        reduce_lr_on_plateau:
          kwargs:
            threshold: 0.001
          lr_scheduler_config:
            monitor: loss/val  # ['loss/train', 'loss/val', '<metric>/train', '<metric>/val', ...]

  loss: mse_loss
  loss_kwargs:
    reduction: "mean"


  metrics:
    mae:
      callable: "Fmetrics.regression.mean_absolute_error"
      kwargs: {}

seed: 42
